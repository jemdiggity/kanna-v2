services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  relay:
    image: gcr.io/kanna-build/kanna-relay:latest
    restart: always
    environment:
      FIREBASE_PROJECT_ID: kanna-build
    expose:
      - "8080"

volumes:
  caddy-data:
  caddy-config:
