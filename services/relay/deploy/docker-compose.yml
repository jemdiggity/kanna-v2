services:
  relay:
    image: ${KANNA_RELAY_IMAGE:?KANNA_RELAY_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      KANNA_OTA_BUCKET: ${KANNA_OTA_BUCKET:?KANNA_OTA_BUCKET is required}
      KANNA_OTA_KEY_ID: ${KANNA_OTA_KEY_ID:?KANNA_OTA_KEY_ID is required}
      KANNA_OTA_PRIVATE_KEY_PATH: ${KANNA_OTA_PRIVATE_KEY_PATH:?KANNA_OTA_PRIVATE_KEY_PATH is required}
      # Optional: when empty the relay uses Application Default Credentials
      # (the VM's attached service account). Set it only for a key-based deploy.
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      # Entitlement enforcement (docs/specs/accounts-and-billing.md, Decision
      # 5). Off until the Slice-3 flag day: the deploy writes no value for it,
      # so this default is what every environment runs. Declared here because a
      # variable absent from this block never reaches the container, however
      # carefully it was written into /opt/kanna-relay/.env.
      KANNA_RELAY_ENTITLEMENT_ENFORCEMENT: ${KANNA_RELAY_ENTITLEMENT_ENFORCEMENT:-off}
      PORT: "8080"
    volumes:
      - /opt/kanna-relay/ota-private-key.pem:/run/secrets/kanna_ota_private_key.pem:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      KANNA_RELAY_DOMAIN: ${KANNA_RELAY_DOMAIN:?KANNA_RELAY_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
