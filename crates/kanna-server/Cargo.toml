[package]
name = "kanna-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.48.2", default-features = false }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
log = "0.4"
libc = "0.2"
flate2 = "1"
tar = "0.4"
flexi_logger = "0.31"
base64 = "0.22"
dirs = "6"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = "2"
kanna-daemon = { path = "../daemon" }
kanna-agent-protocol = { path = "../kanna-agent-protocol" }
kanna-runtime-defaults = { path = "../runtime-defaults" }
kanna-tool-catalog = { path = "../kanna-tool-catalog" }
kanna-visual-companion = { path = "../visual-companion" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
if-addrs = "0.15"
mdns-sd = "0.19"
flume = { version = "0.11", default-features = false }
ignore = "0.4"
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"
# `test-util` for the paused clock: proving that a stable daemon generation
# costs nothing takes minutes of the maintenance loop's time, not of the test
# suite's. Same line as `crates/daemon`, which shares this bazel resolve.
tokio = { version = "1", features = ["full", "test-util"] }
