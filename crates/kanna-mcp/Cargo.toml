[package]
name = "kanna-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
kanna-tool-catalog = { path = "../kanna-tool-catalog" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
kanna-runtime-defaults = { path = "../runtime-defaults" }
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
tungstenite = "0.26"
