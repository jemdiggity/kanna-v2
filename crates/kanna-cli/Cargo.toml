[package]
name = "kanna-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
kanna-runtime-defaults = { path = "../runtime-defaults" }
kanna-tool-catalog = { path = "../kanna-tool-catalog" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "io-util", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tungstenite = "0.26"
