packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "tests/*"
  - "tools/*"
enableGlobalVirtualStore: false
hoist: false
confirmModulesPurge: false
allowBuilds:
  '@firebase/util': false
  appium: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: false
  re2: false
  sharp: false
onlyBuiltDependencies: []
packageExtensions:
  "@apphosting/build@0.1.7":
    dependencies:
      yaml: 2.8.3
  "appium@2.19.0":
    dependencies:
      "@colors/colors": 1.6.0
  # Expo and @expo/dom-webview form a peer cycle. Pin Expo's optional web peer
  # to the SDK 57 React patch so pnpm does not auto-install React DOM 19.2.5
  # beside Expo's required React 19.2.3.
  "expo@57.0.15":
    dependencies:
      react-dom: 19.2.3
  # The React Native Firebase Expo plugin imports this package without
  # declaring it, which fails under pnpm's strict dependency isolation.
  "@react-native-firebase/app@26.0.0":
    dependencies:
      "@expo/config-plugins": 57.0.6
