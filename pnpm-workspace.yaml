packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "tests/*"
  - "tools/*"
enableGlobalVirtualStore: false
hoist: false
confirmModulesPurge: false
allowBuilds:
  '@firebase/util': false
  appium: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: false
  re2: false
  sharp: false
onlyBuiltDependencies: []
packageExtensions:
  "@apphosting/build@0.1.7":
    dependencies:
      yaml: 2.8.3
  "appium@2.19.0":
    dependencies:
      "@colors/colors": 1.6.0
  # Expo and @expo/dom-webview form a peer cycle. Pin Expo's optional web peer
  # to the SDK 57 React patch so pnpm does not auto-install React DOM 19.2.5
  # beside Expo's required React 19.2.3.
  "expo@57.0.6":
    dependencies:
      react-dom: 19.2.3
patchedDependencies:
  # SDK 57.0.6 pulls expo-modules-jsi 57.0.3, whose unqualified Swift `abs`
  # is ambiguous with React Native's C++ JSI imports under Xcode 26.2/Swift 6.
  # Remove this after Expo ships the upstream `Swift.abs` qualification.
  expo-modules-jsi@57.0.3: patches/expo-modules-jsi@57.0.3.patch
