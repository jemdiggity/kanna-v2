[package]
name = "kanna-desktop"
version = "0.0.68"
description = "Kanna Desktop App"
authors = []
edition = "2021"

[lib]
name = "kanna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "service", "tokio"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
flate2 = "1"
tar = "0.4"
kanna-runtime-defaults = { path = "../../../crates/runtime-defaults" }
kanna-server-process = { path = "../../../crates/server-process" }
kanna-agent-protocol = { path = "../../../crates/kanna-agent-protocol" }
chrono = "0.4"
libc = "0.2"
base64 = "0.22"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-webdriver = "0.2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }

[dev-dependencies]
claude-agent-sdk = { path = "../../../crates/claude-agent-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
block2 = "0.6"
