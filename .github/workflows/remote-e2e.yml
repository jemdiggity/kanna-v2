name: Remote E2E

on:
  pull_request:
    paths:
      - "services/relay/**"
      - "crates/kanna-server/**"
      - "services/firebase-functions/**"
      - "apps/mobile/src/lib/**"
      - "tests/remote-e2e/**"
      - "tools/kd/**"
      - ".github/workflows/remote-e2e.yml"

jobs:
  remote-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Layer A relay protocol
        run: pnpm --dir services/relay test

      - name: Layer B remote loop
        run: ./kd test remote-e2e
