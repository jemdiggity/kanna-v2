name: Config Schema Pages

on:
  push:
    branches:
      - main
    paths:
      - ".kanna/config.schema.json"
      - ".github/workflows/config-schema-pages.yml"
      - "tools/kd/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: config-schema-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # `./kd` bootstraps its dependencies through pnpm, so both must exist
      # before it runs. Without these the step fails with `spawnSync pnpm ENOENT`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: ./kd pages build-schema --out-dir .build/pages-schema
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/pages-schema
      - id: deployment
        uses: actions/deploy-pages@v4
